<title>FEDKO Квіз для водіїв</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: одна центрована колонка 480px; темний графіт, помаранчеві акценти; світла поверхня лише для блоку умов */
:root{
  --ink:#141416;          /* фон сторінки */
  --graphite:#232326;     /* поверхні */
  --graphite-2:#2E2E32;   /* картки відповідей */
  --line:#3A3A3F;
  --text:#FFFFFF;
  --muted:#A9A9B0;
  --orange:#FF7919;
  --orange-ink:#1A0E05;
  --paper:#EFF0F2;        /* світла поверхня для довших текстів */
  --paper-text:#1C1C1F;
  --error:#FF9C8A;
  --display:"Montserrat","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
#root{min-height:100%}
.col{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--ink)}
@media (min-width:600px){
  body{background:#0C0C0D;background-image:repeating-linear-gradient(115deg,transparent 0 46px,rgba(255,121,25,.035) 46px 48px)}
  .col{margin-block:24px;min-height:calc(100% - 48px);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);border:1px solid var(--line)}
}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* HERO */
.hero{position:relative;display:flex;flex-direction:column;justify-content:flex-end;background-color:var(--ink);background-repeat:no-repeat;background-size:100% auto;background-position:center -6%;padding-block:min(64vw,290px) 22px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,22,.55) 0%,rgba(20,20,22,0) 18%,rgba(20,20,22,0) 40%,rgba(20,20,22,.82) 58%,var(--ink) 74%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-top{position:absolute;top:16px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;z-index:2}
.logo{height:26px;width:auto;display:block}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--muted);font-size:13px;text-align:center;background:
  repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.03) 22px 24px),linear-gradient(160deg,#2B2B30,#18181B)}
.ph svg{opacity:.5}
.ph b{color:var(--text);font-weight:600}
.eyebrow{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow i{color:var(--orange);font-style:normal}
h1{font-family:var(--display);font-weight:900;font-size:clamp(30px,8.6vw,38px);line-height:1.04;letter-spacing:-.01em;margin:8px 0 0;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--orange)}
.pay{margin-top:16px;background:var(--orange);color:var(--orange-ink);border-radius:12px;padding:6px 14px;display:flex;align-items:baseline;column-gap:8px;flex-wrap:wrap;align-self:flex-start;max-width:100%}
.pay .from{font-family:var(--display);font-weight:800;font-size:15px}
.pay .num{font-family:var(--display);font-weight:900;font-size:34px;line-height:1.1;letter-spacing:-.01em}
.pay .unit{font-family:var(--display);font-weight:800;font-size:15px}
.note{color:var(--muted);font-size:14px;margin:10px 0 0}
.intro-body{display:flex;flex-direction:column;gap:18px;padding-block:6px 20px}
.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.perks li{display:flex;gap:12px;align-items:flex-start;font-weight:600;font-size:15px}
.perks .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--graphite-2);display:grid;place-items:center;color:var(--orange)}
.perks span{padding-top:6px}
.trust{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;border-top:1px solid var(--line);padding-top:14px;color:var(--text)}
.trust::before{content:"";width:18px;height:10px;background:var(--orange);transform:skewX(-25deg);flex:none}
.invite{font-size:15px;color:var(--muted);margin:0}

/* BUTTONS */
.btn{appearance:none;border:0;cursor:pointer;width:100%;min-height:58px;border-radius:14px;background:var(--orange);color:var(--orange-ink);font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.01em;padding:14px 18px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s, filter .15s, opacity .15s;text-align:center}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line);min-height:50px;font-size:14px}
.bar{position:sticky;bottom:0;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(20,20,22,0),var(--ink) 30%);margin-top:auto;z-index:3}

/* QUIZ HEADER */
.qhead{display:flex;flex-direction:column;gap:10px;padding-block:14px 6px;position:sticky;top:0;background:var(--ink);z-index:4}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.back{appearance:none;background:var(--graphite-2);border:0;border-radius:12px;height:40px;padding:0 14px 0 10px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:14px}
.back:hover{background:var(--line)}
.step{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.step b{color:var(--text)}
.prog{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.prog i{height:5px;border-radius:3px;background:var(--graphite-2);transform:skewX(-25deg)}
.prog i.on{background:var(--orange)}
.prog i.last.on{background:var(--text)}

.screen{display:flex;flex-direction:column;gap:14px;padding-block:10px 4px;animation:in .28s ease-out both}
.screen.rev{animation-name:inrev}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inrev{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.btn,.opt{transition:none}}
h2{font-family:var(--display);font-weight:900;font-size:clamp(24px,6.8vw,30px);line-height:1.1;margin:0;text-transform:uppercase;text-wrap:balance}
.lead{color:var(--muted);font-size:15px;margin:0}
.hint{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;margin:0}
.hint svg{flex:none;margin-top:2px;color:var(--orange)}

.thumb{height:96px;background-position:center 62%;border-radius:14px;overflow:hidden;position:relative;background-size:cover;background-position:center}
.thumb .ph{font-size:12px;flex-direction:row}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{appearance:none;width:100%;text-align:left;cursor:pointer;background:var(--graphite-2);border:2px solid transparent;border-radius:14px;min-height:58px;padding:13px 14px;display:flex;align-items:center;gap:13px;font-weight:600;font-size:15.5px;line-height:1.3;transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--line)}
.opt .mk{flex:none;width:24px;height:24px;border:2px solid #6B6B73;display:grid;place-items:center;transition:all .15s}
.opt .mk.c{border-radius:7px}
.opt .mk.r{border-radius:50%}
.opt[aria-checked="true"]{border-color:var(--orange);background:#33281F}
.opt[aria-checked="true"] .mk{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.opt .mk svg{opacity:0}
.opt[aria-checked="true"] .mk svg{opacity:1}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:54px;background:var(--graphite);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--orange)}
.inp.bad{border-color:var(--error)}
.inp::placeholder{color:var(--muted);opacity:.32;letter-spacing:.08em}
.inp.full{border-color:#FF4D3A}
.inp.fa{animation:nudgeA .32s ease-in-out}
.inp.fb{animation:nudgeB .32s ease-in-out}
@keyframes nudgeA{20%{transform:translateX(-5px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}100%{transform:none}}
@keyframes nudgeB{20%{transform:translateX(-5px)}45%{transform:translateX(5px)}70%{transform:translateX(-3px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.inp.full{animation:none}}
.err{color:var(--error);font-size:13.5px;font-weight:600;margin:0}

.route{display:flex;align-items:center;gap:8px;background:var(--graphite);border-radius:14px;padding:12px;flex-wrap:wrap}
.route .pt{font-family:var(--display);font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.02em}
.route .pt.o{color:var(--orange)}
.route .ar{color:var(--muted);display:flex}

.terms{background:var(--paper);color:var(--paper-text);border-radius:14px;padding:14px 16px;list-style:none;margin:0;display:flex;flex-direction:column;gap:10px}
.terms li{display:flex;gap:10px;font-size:15px;font-weight:500;line-height:1.35}
.terms li::before{content:"";flex:none;width:12px;height:8px;margin-top:6px;background:var(--orange);transform:skewX(-25deg)}
.terms b{font-weight:800}

/* CONTACT */
.bonus{border:2px solid var(--orange);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(115deg,rgba(255,121,25,.16),rgba(255,121,25,.02))}
.bonus .big{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.15;color:var(--orange)}
.bonus .cond{font-size:14px;color:var(--text)}
.notice{background:var(--paper);color:var(--paper-text);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.4;font-weight:500}
.phone{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px}
.phone.other{grid-template-columns:118px 84px minmax(0,1fr)}
select.inp{padding-right:8px}
.consent{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:1.4;color:var(--text)}
.consent input{flex:none;width:24px;height:24px;margin:0;accent-color:var(--orange);cursor:pointer}
.priv{font-size:13px;color:var(--muted)}
.priv a{color:var(--orange)}
.priv .slot{border:1px dashed var(--line);border-radius:6px;padding:1px 6px}

/* DONE */
.done-ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--orange);color:var(--orange-ink)}
.done-ic.demo{background:var(--graphite-2);color:var(--orange)}
.demo-box{border:1.5px dashed var(--orange);border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px}
details{background:var(--graphite);border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
pre{margin:10px 0 0;font-size:11.5px;line-height:1.45;overflow-x:auto;white-space:pre;color:#D9D9DE;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;background:var(--graphite-2)}
.pill.ok{color:#8FE3A6}.pill.warn{color:#FFC27A}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

/* ---------- TikTok Pixel: без імені, телефону та відповідей ---------- */
function trackEvent(key, eventId){
  const name = CONFIG.tiktokEvents[key];
  try {
    if (name && window.ttq && typeof window.ttq.track === "function") {
      window.ttq.track(name, { content_name: "fedko_driver_quiz", content_category: "driver_ce_curtainsider" }, eventId ? { event_id: eventId } : undefined);
    }
  } catch(e) {}
}
const firedLeads = new Set();

/* ---------- Воронка: кожен екран квізу — окрема подія (один раз за відвідування) ---------- */
const FUNNEL_EVENTS = ["Quiz_Question_1","Quiz_Question_2","Quiz_Question_3","Quiz_Question_4","Quiz_Question_5","Quiz_Contact_Form"];
const firedSteps = new Set();
function trackFunnelStep(step){
  const name = FUNNEL_EVENTS[step];
  if (!name || firedSteps.has(name)) return;
  firedSteps.add(name);
  const props = { content_name: "fedko_driver_quiz", quiz_step: step + 1 };
  try { if (window.ttq && typeof window.ttq.track === "function") window.ttq.track(name, props); } catch(e) {}
  try { if (typeof window.fbq === "function") window.fbq("trackCustom", name, props); } catch(e) {}  // якщо буде додано Meta Pixel
}

/* ---------- Надсилання заявки: підключи CRM або webhook тут ---------- */
async function submitApplication(payload){
  if (!CONFIG.submitEndpoint) return { mode: "demo" };
  // text/plain — щоб Google Apps Script прийняв запит без CORS-перевірки
  const res = await fetch(CONFIG.submitEndpoint, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json().catch(() => ({}));
  if (!data.ok) throw new Error(data.error || "rejected");
  return { mode: "sent" };
}

  if (ans.experience === "low") flags.push("insufficient_experience");
  if (ans.conditions === "shorter") flags.push("wants_shorter_rotation");
  if (ans.conditions === "pay") flags.push("pay_not_suitable");
  if (ans.experience === "other") unknowns.push("experience_other");
  if (ans.conditions === "other") unknowns.push("conditions_other");
  const status = (flags.length || unknowns.length) ? "Потребує уточнення" : "Попередньо відповідає";
  return { status, flags, unknowns, showNotice: flags.length > 0 };
}

function normalizePhone(country, customCode, raw){
  let digits = String(raw || "").replace(/\D/g, "");
  const code = country.c === "OTHER" ? String(customCode||"").replace(/\D/g,"") : country.d;
  if (raw && raw.trim().startsWith("+")) { if (code && digits.startsWith(code)) digits = digits.slice(code.length); }
  else if (code && digits.startsWith("00" + code)) digits = digits.slice(2 + code.length);
  else if (code && digits.length > country.max && digits.startsWith(code)) digits = digits.slice(code.length);
  // Польські номери не починаються з 0 — це майже завжди український номер з неправильним кодом
  if (country.c === "PL" && digits.startsWith("0")) return { ok:false, reason:"pl_leading_zero" };
  if (digits.startsWith("0") && digits.length === country.min + 1) digits = digits.slice(1);
  const okCode = /^\d{1,4}$/.test(code);
  const ok = okCode && digits.length >= country.min && digits.length <= country.max;
  return { ok, code, national: digits, e164: ok ? "+" + code + digits : null };
}

// Маска введення: лише цифри, ліміт за країною, групування для читабельності
const PHONE_GROUPS = { PL:[3,3,3], UA:[2,3,2,2], CZ:[3,3,3], SK:[3,3,3], NL:[1,4,4], BE:[3,2,2,2], DE:[3,4,4], LT:[3,5], RO:[3,3,3], MD:[2,3,3], BY:[2,3,2,2] };
function formatPhone(countryCode, raw){
  const country = COUNTRIES.find(c => c.c === countryCode);
  let d = String(raw || "").replace(/\D/g, "");
  const s = String(raw || "").trim();
  if (country.d && (s.startsWith("+") || s.startsWith("00"))) {
    if (s.startsWith("00")) d = d.slice(2);
    if (d.startsWith(country.d)) d = d.slice(country.d.length);
  }
  if (countryCode === "UA" && d.startsWith("0")) d = d.slice(1);   // 063… → 63…
  const max = country.max;
  // якщо людина набирає код країни без «+» (48… / 380…), даємо дописати й прибираємо код
  const cap = country.d && d.startsWith(country.d) ? max + country.d.length : max;
  d = d.slice(0, cap);
  if (country.d && d.length > max && d.startsWith(country.d)) d = d.slice(country.d.length);
  d = d.slice(0, max);
  const g = PHONE_GROUPS[countryCode] || [3,3,3,3,3];
  const out = []; let i = 0;
  for (const n of g) { if (i >= d.length) break; out.push(d.slice(i, i + n)); i += n; }
  if (i < d.length) out.push(d.slice(i));
  return out.join(" ");
}
// Підказка в порожньому полі: стільки X, скільки цифр потрібно (PL → XXX XXX XXX)
function phoneMask(countryCode){
  const country = COUNTRIES.find(c => c.c === countryCode);
  if (!country || countryCode === "OTHER") return "Номер телефону";
  return formatPhone(countryCode, "9".repeat(country.max)).replace(/9/g, "X");
}

function labelFor(q, id){ const o = q.options.find(o => o[0] === id); return o ? o[1] : null; }

function buildPayload(ans, other, contact, phone, result){
  const answers = {};
  QUESTIONS.forEach(q => {
    const v = ans[q.id];
    answers[q.id] = {
      question: q.title,
      value: v,
      label: Array.isArray(v) ? v.map(id => labelFor(q, id)) : labelFor(q, v),
      other_text: (Array.isArray(v) ? v.includes("other") : v === "other") ? (other[q.id] || "").trim() : undefined
    };
  });
  let utm = {};
  try { new URLSearchParams(location.search).forEach((val, key) => { if (/^(utm_|ttclid)/.test(key)) utm[key] = val; }); } catch(e) {}
  return {
    created_at: new Date().toISOString(),
    vacancy: "C+E, штори, DE/BE/NL, база Любек",
    source: { channel: "tiktok", form: "fedko_driver_quiz_v1", ...utm },
    answers,
    contact: { name: contact.name.trim(), phone: { country: contact.country, dial_code: "+" + phone.code, national: phone.national, e164: phone.e164 } },
    consent: { given: true, text: CONSENT_TEXT, at: new Date().toISOString() },

}

function App(){
  const [step, setStep] = useState(-1);        // -1 інтро, 0..4 питання, 5 контакт, 6 готово
  const [dir, setDir] = useState(1);
  const [ans, setAns] = useState({ documents: [] });
  const [other, setOther] = useState({});
  const [showErr, setShowErr] = useState(false);
  const [contact, setContact] = useState({ name:"", country:"PL", code:"", phone:"", consent:false });
  const [errors, setErrors] = useState({});
  const [sending, setSending] = useState(false);
  const [done, setDone] = useState(null);
  const completedOnce = useRef(false);
  const advTimer = useRef(null);

  useEffect(() => { try { window.scrollTo({top:0}); } catch(e){} }, [step]);
  useEffect(() => { if (step >= 0 && step <= 5) trackFunnelStep(step); }, [step]);

  const go = (n, d) => { clearTimeout(advTimer.current); setDir(d); setShowErr(false); setErrors({}); setStep(n); };

  const q = step >= 0 && step < 5 ? QUESTIONS[step] : null;
  const valid = (qq) => {
    const v = ans[qq.id];
    if (qq.multi) return Array.isArray(v) && v.length > 0;
    if (!v) return false;
    if (v === "other") return !!(other[qq.id] || "").trim();
    return true;
  };

  const next = () => {
    if (q && !valid(q)) { setShowErr(true); return; }
    if (step === 4 && !completedOnce.current) { completedOnce.current = true; trackEvent("questionsCompleted"); }
    go(step + 1, 1);
  };

  const setValue = (v) => {
    setAns(a => ({ ...a, [q.id]: v })); setShowErr(false);
    if (!q.multi && v !== "other") {
      const cur = step;
      clearTimeout(advTimer.current);
      advTimer.current = setTimeout(() => {
        setStep(s => {
          if (s !== cur) return s;
          if (cur === 4 && !completedOnce.current) { completedOnce.current = true; trackEvent("questionsCompleted"); }
          setDir(1); return cur + 1;
        });
      }, 280);
    }
  };

  const result = screen(ans);

  const submit = async () => {
    const e = {};
    if (contact.name.trim().length < 2) e.name = "Напиши своє ім’я.";
    const country = COUNTRIES.find(c => c.c === contact.country);
    const ph = normalizePhone(country, contact.code, contact.phone);
    if (!ph.ok) e.phone = ph.reason === "pl_leading_zero"
      ? "Схоже, це український номер — обери код UA +380"
      : "Перевір номер телефону та код країни";
    if (!contact.consent) e.consent = "Щоб рекрутер міг зв’язатися з тобою, постав позначку згоди.";
    setErrors(e);
    if (Object.keys(e).length) return;
    const payload = buildPayload(ans, other, contact, ph, result);
    setSending(true);
    try {
      const r = await submitApplication(payload);
      setDone({ mode: r.mode, payload }); go(6, 1);
    } catch(err) {
      setErrors({ submit: "Не вдалося надіслати заявку. Перевір з’єднання й спробуй ще раз." });
    } finally { setSending(false); }
  };

  const restart = () => {
    setAns({ documents: [] }); setOther({}); setContact({ name:"", country:"PL", code:"", phone:"", consent:false });
    setDone(null); completedOnce.current = false; go(-1, -1);
  };

  let body;
  if (step === -1) body = h(Intro,{onStart:() => { trackEvent("quizStart"); go(0,1); }});
  else if (step === 6) body = h(Done,{mode:done.mode,payload:done.payload,onRestart:restart});
  else body = h(React.Fragment,null,
    h(Header,{stepIndex:step,onBack:() => go(step-1,-1)}),
    step < 5
      ? h(Question,{key:q.id,q,dir,value:ans[q.id],otherText:other[q.id],showErr,
          setValue, setOther:t => { setOther(o => ({...o,[q.id]:t})); setShowErr(false); }})
      : h(Contact,{key:"contact",dir,result,contact,setContact,errors}),
    h("div",{className:"bar gut"},
      step < 5
        ? h("button",{className:"btn",id:"next-btn",onClick:next},"Далі",Ico.arrow())
        : h("button",{className:"btn",id:"submit-btn",onClick:submit,disabled:sending}, sending ? "Надсилаємо…" : "Обговорити роботу з рекрутером"))
  );
  return h("main",{className:"col"}, body);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>

</body>
</html>
